date_range:
  start_year: 2006
  end_year: 2026
  start_date: "2006-01-01"
  end_date: "2026-12-31"

queries:
  pubmed: '(("metroplasty"[Title/Abstract] OR "hysteroplasty"[Title/Abstract] OR "uterine repair"[Title/Abstract] OR "repair of uterine rupture"[Title/Abstract] OR "repair of uterine dehiscence"[Title/Abstract] OR "uterine scar repair"[Title/Abstract] OR "isthmocele repair"[Title/Abstract] OR "strassmann"[Title/Abstract] OR ("uterine dehiscence"[Title/Abstract] AND ("repair"[Title/Abstract] OR "suture"[Title/Abstract] OR "reconstruction"[Title/Abstract] OR "patch"[Title/Abstract])) OR ("uterine rupture"[Title/Abstract] AND ("prolongation"[Title/Abstract] OR "ongoing pregnancy"[Title/Abstract] OR "continuing pregnancy"[Title/Abstract] OR "antenatal repair"[Title/Abstract] OR "second trimester repair"[Title/Abstract]))) AND ("pregnancy"[MeSH Terms] OR "pregnant"[Title/Abstract] OR "pregnancy"[Title/Abstract] OR "antenatal"[Title/Abstract] OR "gravid"[Title/Abstract] OR "cesarean"[Title/Abstract] OR "gestation"[Title/Abstract])) AND ("2006/01/01"[Date - Publication] : "2026/12/31"[Date - Publication])'
  europepmc: '(("metroplasty" OR "hysteroplasty" OR "uterine scar repair" OR "isthmocele repair" OR "repair of uterine dehiscence" OR "repair of uterine rupture" OR "Strassmann metroplasty") AND ("pregnancy" OR "pregnant" OR "antenatal" OR "second trimester" OR "case report" OR "cesarean")) AND (FIRST_PDATE:[2006-01-01 TO 2026-12-31])'
  openalex_search: "metroplasty pregnancy uterine repair"
  clinical_trials_condition: "Uterine Scar Defect Pregnancy"

