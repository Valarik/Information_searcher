date_range:
  start_year: 2010
  end_year: 2026
  start_date: "2010-01-01"
  end_date: "2026-12-31"

queries:
  pubmed: '(("trigger finger"[Title/Abstract] OR "trigger digits"[Title/Abstract] OR "trigger digit"[Title/Abstract] OR "trigger thumb"[Title/Abstract] OR "stenosing tenosynovitis"[Title/Abstract] OR "stenosing tendovaginitis"[Title/Abstract] OR "Notta"[Title/Abstract] OR "A1 pulley release"[Title/Abstract] OR "Trigger Finger Disorder"[MeSH Terms]) AND ("PIP"[Title/Abstract] OR "proximal interphalangeal"[Title/Abstract] OR "contracture"[Title/Abstract] OR "extension deficit"[Title/Abstract] OR "extension lag"[Title/Abstract] OR "stiffness"[Title/Abstract] OR "pain"[Title/Abstract] OR "complication"[Title/Abstract] OR "complications"[Title/Abstract] OR "recurrence"[Title/Abstract] OR "flexor digitorum superficialis"[Title/Abstract] OR "FDS"[Title/Abstract] OR "A2 pulley"[Title/Abstract] OR "percutaneous"[Title/Abstract] OR "open release"[Title/Abstract] OR "corticosteroid"[Title/Abstract] OR "splint"[Title/Abstract] OR "natural history"[Title/Abstract] OR "randomized"[Title/Abstract] OR "systematic review"[Title/Abstract])) AND ("2010/01/01"[Date - Publication] : "2026/12/31"[Date - Publication])'
  europepmc: '(("trigger finger" OR "trigger digit" OR "stenosing tenosynovitis" OR "A1 pulley release") AND ("proximal interphalangeal" OR "PIP joint" OR "extension deficit" OR "flexion contracture" OR "stiffness" OR "postoperative pain" OR "flexor digitorum superficialis" OR "recurrence" OR "corticosteroid" OR "percutaneous release")) AND (FIRST_PDATE:[2010-01-01 TO 2026-12-31])'
  openalex_search: "trigger finger A1 pulley release proximal interphalangeal contracture"
  clinical_trials_condition: "Trigger Finger"

triage_rules:
  prioritize_case_reports: true
  core_terms:
    - "trigger finger"
    - "trigger digit"
    - "trigger thumb"
    - "stenosing tenosynovitis"
    - "stenosing tendovaginitis"
    - "a1 pulley"
    - "notta"
    - "flexor tendon"
    - "pulley release"
  context_terms:
    - "pip"
    - "proximal interphalangeal"
    - "contracture"
    - "extension"
    - "stiffness"
    - "pain"
    - "release"
    - "percutaneous"
    - "corticosteroid"
    - "steroid"
    - "injection"
    - "splint"
    - "ultrasound"
    - "fds"
    - "superficialis"
    - "recurrence"
    - "hand"
    - "finger"
    - "digit"
  exclusion_rules:
    - status: "excluded_animal_veterinary"
      trigger_terms:
        - "equine"
        - "bovine"
        - "canine"
        - "horse"
        - "dogs"
      unless_terms:
        - "human"
        - "patient"
  rare_complication_terms:
    - "bowstringing"
    - "a2 pulley injury"
    - "digital nerve injury"
    - "tendon rupture"
    - "flexion contracture"
    - "extension deficit"
    - "extension lag"
    - "complex regional pain"
    - "septic tenosynovitis"
    - "persistent triggering"

verification_rules:
  required_terms:
    - "Нотта"
    - "проксимальн"
    - "ПМФС"
    - "6 мес"
    - "Плюсы"
    - "Минусы"

