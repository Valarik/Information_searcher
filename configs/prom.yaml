date_range:
  start_year: 2016
  end_year: 2026
  start_date: "2016-01-01"
  end_date: "2026-12-31"

queries:
  pubmed: '("Fetal Membranes, Premature Rupture"[MeSH Terms] OR "premature rupture of membranes"[Title/Abstract] OR "preterm premature rupture of membranes"[Title/Abstract] OR "prelabor rupture of membranes"[Title/Abstract] OR "prelabour rupture of membranes"[Title/Abstract] OR PPROM[Title/Abstract]) AND ("2016/01/01"[Date - Publication] : "2026/12/31"[Date - Publication]) AND ( Systematic Review[pt] OR Meta-Analysis[pt] OR Randomized Controlled Trial[pt] OR Clinical Trial[pt] OR Practice Guideline[pt] OR Guideline[pt] OR Multicenter Study[pt] OR Observational Study[pt] OR Comparative Study[pt] OR "cohort"[Title/Abstract] OR "pathogenesis"[Title/Abstract] OR "microbiome"[Title/Abstract] OR "biomarker"[Title/Abstract] OR "chorioamnionitis"[Title/Abstract] OR "latency"[Title/Abstract] OR "expectant management"[Title/Abstract] OR "induction"[Title/Abstract] OR "antibiotic"[Title/Abstract] OR "amniopatch"[Title/Abstract] OR "amnioinfusion"[Title/Abstract] )'
  europepmc: '(("premature rupture of membranes" OR "preterm premature rupture of membranes" OR "prelabor rupture of membranes" OR "PPROM") AND ("randomized" OR "meta-analysis" OR "systematic review" OR "cohort" OR "chorioamnionitis" OR "expectant management" OR "induction" OR "pathogenesis" OR "biomarker")) AND (FIRST_PDATE:[2016-01-01 TO 2026-12-31])'
  openalex_search: "preterm premature rupture of membranes PPROM"
  clinical_trials_condition: "Premature Rupture of Membranes"

